[package]
name = "yuki-client"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
description = "Typed async client for the Yuki bookkeeping SOAP API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rvben/yuki-cli"
keywords = ["yuki", "bookkeeping", "soap", "accounting"]
categories = ["api-bindings"]

[lib]
name = "yuki_client"
path = "src/lib.rs"

[dependencies]
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize/Deserialize for plain value types such as `Region`.
serde = ["dep:serde"]

# Local UTC offset for `period::today()`; already in the tree via tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
